plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.videoengine'
version = '0.1.0'

// Keep in sync with the Media3 version used by expo-video, otherwise Gradle
// upgrades every media3 artifact and expo-video may break at runtime.
def media3Version = "1.9.1"

android {
  namespace "expo.modules.videoengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.media3:media3-transformer:${media3Version}"
  implementation "androidx.media3:media3-effect:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
}
